[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "band-agentd"
version = "0.1.0"
description = "Run durable Band Codex and Claude agents as supervised services"
requires-python = ">=3.11"
dependencies = [
    "band-sdk>=7.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
codex = ["band-sdk[codex]>=7.0.0"]
claude = ["band-sdk[claude_sdk]>=7.0.0"]

[project.scripts]
band-agentd = "band_agentd.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/band_agentd"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
